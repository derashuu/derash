<!DOCTYPE html>
<html lang="am">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <title>ETFC 002 — ኮርነር (አድሚን)</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- GATE -->
    <div class="gate" id="gate">
      <div class="gate-box">
        <h1 class="display">THE CORNER</h1>
        <p>ለአድሚን ብቻ። የይለፍ ቃል አስገባ።</p>
        <div class="field">
          <input type="password" id="passInput" placeholder="የይለፍ ቃል" />
        </div>
        <button class="btn btn-primary" id="enterBtn" style="width: 100%">
          ግባ
        </button>
        <div class="gate-error" id="gateError"></div>
      </div>
    </div>

    <!-- ADMIN SHELL -->
    <div class="admin-shell" id="adminShell">
      <header class="marquee">
        <div class="event-tag">ETFC 002 &middot; አድሚን</div>
        <h1>THE <span>CORNER</span></h1>
        <p>የክፍያ ስክሪንሾቶችን ገምግም፣ ደጋፊዎችን አጽድቅ ወይም ውድቅ አድርግ፣ ውጤት አስመዝግብ።</p>
      </header>

      <main class="shell">
        <p class="section-label">የተጫዋቾች ዝርዝር</p>
        <div id="fighterChips" style="margin-bottom: 12px"></div>
        <form
          id="addFighterForm"
          style="display: flex; gap: 8px; margin-bottom: 36px"
        >
          <input
            type="text"
            id="newFighterName"
            placeholder="የተጫዋች ስም ጨምር"
            style="
              flex: 1;
              background: var(--surface);
              border: 1px solid var(--line);
              border-radius: 4px;
              padding: 10px 12px;
              color: var(--bone);
            "
          />
          <button type="submit" class="btn btn-ghost">ጨምር</button>
        </form>

        <p class="section-label">ሁሉም ውርርዶች</p>
        <div id="bouts"></div>
      </main>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>
    <script>
      // ---------- gate ----------
      const gate = document.getElementById("gate");
      const adminShell = document.getElementById("adminShell");
      const gateError = document.getElementById("gateError");

      function tryEnter() {
        const val = document.getElementById("passInput").value;
        if (val === ADMIN_PASSCODE) {
          sessionStorage.setItem("etfc_admin_ok", "1");
          gate.style.display = "none";
          adminShell.classList.add("open");
          boot();
        } else {
          gateError.textContent = "የተሳሳተ የይለፍ ቃል።";
        }
      }

      document.getElementById("enterBtn").addEventListener("click", tryEnter);
      document.getElementById("passInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") tryEnter();
      });

      if (sessionStorage.getItem("etfc_admin_ok") === "1") {
        gate.style.display = "none";
        adminShell.classList.add("open");
        boot();
      }

      // ---------- shared helpers ----------
      const toastEl = document.getElementById("toast");
      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        setTimeout(() => toastEl.classList.remove("show"), 3200);
      }
      function money(n) {
        return Number(n).toLocaleString("en-US") + " ETB";
      }
      function escapeHtml(str) {
        const d = document.createElement("div");
        d.textContent = str;
        return d.innerHTML;
      }

      // ---------- boot: only runs after passcode accepted ----------
      function boot() {
        listenFighters();
        listenBouts();

        document
          .getElementById("addFighterForm")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const input = document.getElementById("newFighterName");
            const name = input.value.trim();
            if (!name) return;
            await db.collection("fighters").add({ name });
            input.value = "";
          });
      }

      // ---------- fighter roster ----------
      function listenFighters() {
        db.collection("fighters")
          .orderBy("name")
          .onSnapshot(
            (snap) => {
              const el = document.getElementById("fighterChips");
              if (snap.empty) {
                el.innerHTML = `<div class="empty-state">እስካሁን ተጫዋች የለም። ከታች ጨምር።</div>`;
                return;
              }
              el.innerHTML = snap.docs
                .map(
                  (doc) => `
      <span class="fighter-chip">
        ${escapeHtml(doc.data().name)}
        <button data-id="${doc.id}" title="Remove fighter">&times;</button>
      </span>
    `
                )
                .join("");
              el.querySelectorAll("button[data-id]").forEach((btn) => {
                btn.addEventListener("click", () =>
                  db.collection("fighters").doc(btn.dataset.id).delete()
                );
              });
            },
            (err) => {
              console.error("listenFighters failed:", err);
              document.getElementById(
                "fighterChips"
              ).innerHTML = `<div class="error-state">ተጫዋቾችን መጫን አልተቻለም — ኮንሶልውን (F12) አረጋግጥ።</div>`;
            }
          );
      }

      // ---------- bouts ----------
      function renderChallengerAdminRow(bet, c) {
        return `
    <div class="challenger-row" style="align-items:flex-start;">
      <div>
        <div class="name">${escapeHtml(c.name)}${
          c.phone
            ? ' <span class="contact">' + escapeHtml(c.phone) + "</span>"
            : ""
        } <span class="amt">${money(c.amount)}</span></div>
        <a class="screenshot-link" href="${
          c.screenshotUrl
        }" target="_blank" rel="noopener">የክፍያ ስክሪንሾት ይመልከቱ &rarr;</a>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="pill ${c.status}">${c.status}</span>
        ${
          c.status === "pending"
            ? `
          <button class="btn-approve" data-bet="${bet.id}" data-cid="${c.id}" data-action="approve">አጽድቅ</button>
          <button class="btn-reject" data-bet="${bet.id}" data-cid="${c.id}" data-action="reject">ውድቅ አድርግ</button>
        `
            : ""
        }
      </div>
    </div>
  `;
      }

      function renderChallengersAdmin(bet) {
        if (!bet.challengers || bet.challengers.length === 0) {
          return `<div class="empty-state" style="margin:0 20px 16px;">እስካሁን ደጋፊ የለም።</div>`;
        }
        const rows = bet.challengers
          .map((c) => renderChallengerAdminRow(bet, c))
          .join("");
        return `<div class="challenger-list">${rows}</div>`;
      }

      function renderResultRow(bet) {
        const options = [
          `<option value="">ገና ውጤት የለም</option>`,
          `<option value="${escapeHtml(bet.fighterName)}"${
            bet.result === bet.fighterName ? " selected" : ""
          }>${escapeHtml(bet.fighterName)} ያሸንፋል (የፈጣሪው ምርጫ)</option>`,
          `<option value="OPPONENT"${
            bet.result === "OPPONENT" ? " selected" : ""
          }>ተቃራኒ ወገን ያሸንፋል (ተቃራኒው ይከፈላል)</option>`,
        ];
        return `
    <div class="result-row">
      <span style="font-size:12px; color:var(--smoke); text-transform:uppercase; letter-spacing:0.08em;">ውጤት አስመዝግብ፦</span>
      <select data-bet="${bet.id}" data-action="settle">${options.join(
          ""
        )}</select>
    </div>
  `;
      }

function renderBouts(bets) {
        const boutsEl = document.getElementById("bouts");
        if (bets.length === 0) {
          boutsEl.innerHTML = `<div class="empty-state">እስካሁን ውርርድ የለም።</div>`;
          return;
        }
        boutsEl.innerHTML = bets
          .map((bet, i) => {
            const opponentFighter = FIGHTER_OPPONENTS[bet.fighterName];
            const isPendingCreator = bet.status === "pending_creator_payment";
            const creatorPayment = bet.creatorPayment;
            return `
    <div class="bout">
      <div class="bout-number">ፍልሚያ ${String(i + 1).padStart(2, "0")}${
              bet.amount < 10000
                ? ' <span class="pill rejected">10k ከታች</span>'
                : ""
          }</div>
      <div class="bout-main">
        <div class="corner red">
          <p class="who">${escapeHtml(bet.creatorName)}${
              bet.creatorPhone ? " · " + escapeHtml(bet.creatorPhone) : ""
            } የሚደግፈው</p>
          <p class="fighter">${escapeHtml(bet.fighterName)}</p>
          <p class="stake">${money(bet.amount)}</p>
        </div>
        <div class="vs-seam">VS</div>
        <div class="corner blue">
          <p class="who">ሁኔታ</p>
          <p class="fighter" style="font-size:18px;">${
            bet.status === "settled"
              ? bet.result === "OPPONENT"
                ? opponentFighter || "ተቃራኒ ወገን"
                : bet.result || "ውጤት የለም"
              : isPendingCreator
              ? "የፈጣሪው ክፍያ በመጠበቅ ላይ"
              : opponentFighter || "ክፍት"
          }</p>
        </div>
      </div>
      ${
        bet.note ? `<div class="bout-note">"${escapeHtml(bet.note)}"</div>` : ""
      }
      ${isPendingCreator && creatorPayment ? `
        <div class="challenger-list">
          <div class="challenger-row" style="align-items:flex-start;">
            <div>
              <div class="name">${escapeHtml(creatorPayment.name)}${
                creatorPayment.phone
                  ? ' <span class="contact">' + escapeHtml(creatorPayment.phone) + "</span>"
                  : ""
              } <span class="amt">${money(creatorPayment.amount)}</span></div>
              <div>የፈጣሪው ክፍያ</div>
              <a class="screenshot-link" href="${
                creatorPayment.screenshotUrl
              }" target="_blank" rel="noopener">የክፍያ ስክሪንሾት ይመልከቱ &rarr;</a>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="pill ${creatorPayment.status}">${creatorPayment.status}</span>
              ${
                creatorPayment.status === "pending"
                  ? `
                <button class="btn-approve" data-bet="${bet.id}" data-cid="creator" data-action="approve_creator">Approve</button>
                <button class="btn-reject" data-bet="${bet.id}" data-cid="creator" data-action="reject_creator">Reject</button>
              `
                  : ""
              }
            </div>
          </div>
        </div>
      ` : ""}
      ${renderChallengersAdmin(bet)}
      ${renderResultRow(bet)}
      <div class="result-row">
        <button class="btn-reject" data-bet="${bet.id}" data-action="delete">Delete this bet</button>
      </div>
    </div>
  `;
          })
          .join("");

        boutsEl
          .querySelectorAll('[data-action="approve"], [data-action="reject"]')
          .forEach((btn) => {
            btn.addEventListener("click", async () => {
              const bet = bets.find((b) => b.id === btn.dataset.bet);
              const action = btn.dataset.action;
              const cid = btn.dataset.cid;

              if (action === "approve_creator" || action === "reject_creator") {
                const newStatus = action === "approve_creator" ? "approved" : "rejected";
                const updateData = {
                  "creatorPayment.status": newStatus,
                };
                if (newStatus === "approved") {
                  updateData.status = "open";
                }
                await db
                  .collection("bets")
                  .doc(bet.id)
                  .update(updateData);
                showToast(`የፈጣሪው ክፍያ ${newStatus === "approved" ? "ተተባበረ" : "ተወድቋል"}።`);
                return;
              }

              const newStatus = action === "approve" ? "approved" : "rejected";
              const updated = bet.challengers.map((c) =>
                c.id === cid ? { ...c, status: newStatus } : c
              );
              await db
                .collection("bets")
                .doc(bet.id)
                .update({ challengers: updated });
              showToast(`ደጋፊው ${newStatus === "approved" ? "ተተባበረ" : "ተወድቋል"}።`);
            });
          });

        boutsEl.querySelectorAll('[data-action="delete"]').forEach((btn) => {
          btn.addEventListener("click", async () => {
            if (!confirm("ይህን ውርርድ ለዘላለም ማጥፋት አለብህ? ይህ ማድረግ አይቻልም።")) return;
            await db.collection("bets").doc(btn.dataset.bet).delete();
            showToast("ውርርድ ተጠፋ።");
          });
        });

        boutsEl.querySelectorAll('[data-action="settle"]').forEach((sel) => {
          sel.addEventListener("change", async () => {
            const betId = sel.dataset.bet;
            const value = sel.value;
            await db
              .collection("bets")
              .doc(betId)
              .update({
                status: value ? "settled" : "open",
                result: value || null,
              });
            showToast(value ? "ውርርዱ ተጠናቋል።" : "ውርርዱ እንደገና ተከፍቷል።");
          });
        });
      }

      function listenBouts() {
        db.collection("bets")
          .orderBy("createdAt", "desc")
          .onSnapshot(
            (snap) => {
              const bets = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
              renderBouts(bets);
            },
            (err) => {
              console.error("listenBouts failed:", err);
              document.getElementById(
                "bouts"
              ).innerHTML = `<div class="error-state">ውርርዶቹን መጫን አልተቻለም — ኮንሶልውን (F12) አረጋግጥ።</div>`;
            }
          );
      }
    </script>
  </body>
</html>
